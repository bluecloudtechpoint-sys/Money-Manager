<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318"><link rel="manifest" href="manifest.json">
<title>Money Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17181b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111318;color:white;padding:18px 16px 14px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:23px}.sub{font-size:12px;opacity:.7;margin-top:3px}
.wrap{max-width:920px;margin:auto;padding:14px 14px 100px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.tabs button{border:0;border-radius:10px;padding:10px 13px;white-space:nowrap;background:#e7e9ee}.tabs .on{background:#111318;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#fff;border:1px solid #e5e6e9;border-radius:16px;padding:14px}.label{font-size:11px;color:#737780}.num{font-size:20px;font-weight:800;margin-top:4px}.green{color:#16803b}.red{color:#c0392b}.blue{color:#2867d8}.orange{color:#b76b00}
.section{margin-top:17px}.title{font-size:17px;font-weight:800;margin-bottom:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.btn{border:0;border-radius:11px;padding:12px;background:#111318;color:#fff;font-weight:750}.btn.alt{background:#e7e9ee;color:#111318}.btn.warn{background:#fff0df;color:#9a5900}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.small{font-size:11px;color:#737780;margin-top:3px}.right{text-align:right}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;background:#edf2ff;color:#2867d8}.pill.red{background:#fff0f0;color:#c0392b}.pill.green{background:#edf8ef;color:#16803b}.pill.orange{background:#fff4e4;color:#b76b00}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:15px;margin-bottom:9px}.empty{text-align:center;color:#777;padding:20px;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px;max-height:94vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{font-size:11px;color:#666}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0 11px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:7}nav button{border:0;background:none;font-size:11px;color:#666}.active{color:#2867d8!important;font-weight:800}
.kpi{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.kpi:last-child{border:0}
@media(min-width:680px){.grid{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header><h1 id="appTitle">Money Manager</h1><div class="sub">Loans • EMIs • Customers • Udhar • Cash Flow</div></header>
<div class="wrap"><div class="tabs">
<button class="on" onclick="go('dash',this)">Dashboard</button><button onclick="go('customers',this)">Customers</button><button onclick="go('loans',this)">Banks & Loans</button><button onclick="go('tx',this)">Transactions</button><button onclick="go('reports',this)">Reports</button><button onclick="go('settings',this)">Settings</button>
</div><div id="app"></div></div>
<nav><button class="active" onclick="go('dash')">⌂<br>Home</button><button onclick="openModal('customer')">👤<br>Customer</button><button onclick="openModal('loan')">💳<br>Loan/EMI</button><button onclick="openModal('tx')">＋<br>Transaction</button><button onclick="backup()">💾<br>Backup</button></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2 id="mh">Add</h2><form id="form" onsubmit="saveForm(event)"><div id="fields"></div><button class="btn" style="width:100%">Save</button></form></div></div>
<input id="restore" type="file" accept=".json" style="display:none" onchange="restoreFile(event)">
<script>
const KEY='money_manager_production_v1';let D=JSON.parse(localStorage.getItem(KEY)||'{"customers":[],"loans":[],"tx":[],"settings":{"business":"Money Manager","pin":""}}');
const $=id=>document.getElementById(id),money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN'),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function cname(id){let c=D.customers.find(x=>String(x.id)===String(id));return c?c.name:'—'}
function loanPaid(id){return D.tx.filter(x=>x.kind==='emi'&&String(x.loan)===String(id)).reduce((a,x)=>a+x.amount,0)}
function go(p,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');render(p)}
function render(p='dash'){
let rec=D.tx.filter(x=>['in','recovered'].includes(x.kind)).reduce((a,x)=>a+x.amount,0),paid=D.tx.filter(x=>['out','emi'].includes(x.kind)).reduce((a,x)=>a+x.amount,0),given=D.tx.filter(x=>x.kind==='given').reduce((a,x)=>a+x.amount,0),recovered=D.tx.filter(x=>x.kind==='recovered').reduce((a,x)=>a+x.amount,0);
if(p==='dash')$('app').innerHTML=`<div class="grid"><div class="card"><div class="label">Money Received</div><div class="num green">${money(rec)}</div></div><div class="card"><div class="label">Money Paid</div><div class="num red">${money(paid)}</div></div><div class="card"><div class="label">Pending Udhar</div><div class="num orange">${money(Math.max(0,given-recovered))}</div></div><div class="card"><div class="label">Monthly EMI</div><div class="num blue">${money(D.loans.reduce((a,l)=>a+l.emi,0))}</div></div></div><div class="actions"><button class="btn" onclick="openModal('customer')">+ Customer</button><button class="btn" onclick="openModal('loan')">+ Bank / Loan</button><button class="btn alt" onclick="openModal('tx')">+ Transaction</button><button class="btn warn" onclick="notifyDue()">🔔 Check Reminders</button></div><div class="section"><div class="title">EMI Schedule</div><div class="card">${D.loans.length?D.loans.map(loanRow).join(''):'<div class="empty">No loans added.</div>'}</div></div><div class="section"><div class="title">Recent Activity</div><div class="card">${txRows(8)}</div></div>`;
if(p==='customers')$('app').innerHTML=`<input class="search" placeholder="Search customer..." oninput="filterCustomers(this.value)"><div id="customerList" class="card">${customerRows(D.customers)}</div>`;
if(p==='loans')$('app').innerHTML=`<div class="actions"><button class="btn" onclick="openModal('loan')">+ Bank / Loan / EMI</button></div><div class="card">${D.loans.length?D.loans.map(loanRow).join(''):'<div class="empty">No loans added.</div>'}</div>`;
if(p==='tx')$('app').innerHTML=`<div class="actions"><button class="btn" onclick="openModal('tx')">+ Transaction</button></div><div class="card">${txRows(200)}</div>`;
if(p==='reports')$('app').innerHTML=reports(rec,paid,given,recovered);
if(p==='settings')$('app').innerHTML=`<div class="card"><div class="title">Settings</div><label>Business / Account Name</label><input id="biz" value="${esc(D.settings.business)}"><button class="btn" onclick="setBiz()">Save Name</button><hr><button class="btn alt" onclick="requestNotify()">Enable Notifications</button><br><br><button class="btn alt" onclick="document.getElementById('restore').click()">Restore Backup</button><br><br><button class="btn" onclick="backup()">Export Backup</button><p class="small">Data is stored locally in this browser. Keep regular backups.</p></div>`;
$('appTitle').textContent=D.settings.business||'Money Manager';
}
function customerRows(a){if(!a.length)return '<div class="empty">No customers.</div>';return a.map(c=>{let g=(c.opening||0)+D.tx.filter(x=>x.customer==c.id&&x.kind==='given').reduce((a,x)=>a+x.amount,0),r=D.tx.filter(x=>x.customer==c.id&&x.kind==='recovered').reduce((a,x)=>a+x.amount,0);return `<div class="item"><div><b>${esc(c.name)}</b><div class="small">${esc(c.phone||'No phone')} • ${D.tx.filter(x=>x.customer==c.id).length} entries</div></div><div class="right"><b>${money(Math.max(0,g-r))}</b><div class="small">pending</div></div></div>`}).join('')}
function filterCustomers(q){q=q.toLowerCase();$('customerList').innerHTML=customerRows(D.customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q)))}
function loanRow(l){let paid=loanPaid(l.id),count=Math.min(l.total,Math.floor(paid/l.emi)),left=Math.max(0,l.total-count),out=Math.max(0,l.amount-paid);return `<div class="item"><div><b>${esc(l.bank)} — ${esc(l.name)}</b><div class="small">Loan ${money(l.amount)} • EMI ${money(l.emi)} • Due ${l.due}th</div><div class="small">${count}/${l.total} paid • ${left} remaining • Outstanding ${money(out)}</div></div><div class="right"><span class="pill ${left===0?'green':'blue'}">${left===0?'Paid':'Active'}</span>${left?`<br><button class="btn" style="padding:7px 9px;margin-top:6px" onclick="quickEMI(${l.id})">Mark Paid</button>`:''}</div></div>`}
function txRows(n){if(!D.tx.length)return '<div class="empty">No transactions yet.</div>';return D.tx.slice(0,n).map(x=>{let plus=['in','recovered'].includes(x.kind),ln=D.loans.find(l=>l.id==x.loan);return `<div class="item"><div><b>${esc(x.desc)}</b><div class="small">${x.date} • ${x.method}${x.customer?' • '+esc(cname(x.customer)):''}${ln?' • '+esc(ln.name):''}</div></div><div class="right"><b class="${plus?'green':'red'}">${plus?'+':'-'}${money(x.amount)}</b><div class="small">${x.kind}</div></div></div>`}).join('')}
function reports(rec,paid,given,recovered){let out=D.loans.reduce((a,l)=>a+Math.max(0,l.amount-loanPaid(l.id)),0);return `<div class="card"><div class="title">Overall Report</div><div class="kpi"><span>Money Received</span><b class="green">${money(rec)}</b></div><div class="kpi"><span>Money Paid</span><b class="red">${money(paid)}</b></div><div class="kpi"><span>Udhar Given</span><b>${money(given)}</b></div><div class="kpi"><span>Udhar Recovered</span><b class="green">${money(recovered)}</b></div><div class="kpi"><span>Pending Udhar</span><b class="orange">${money(Math.max(0,given-recovered))}</b></div><div class="kpi"><span>Loan Outstanding</span><b class="blue">${money(out)}</b></div><div class="kpi"><span>Monthly EMI</span><b>${money(D.loans.reduce((a,l)=>a+l.emi,0))}</b></div></div><div class="section"><div class="title">Bank-wise</div><div class="card">${bankSummary()}</div></div><div class="section"><button class="btn" onclick="exportCSV()">Export CSV</button></div>`}
function bankSummary(){let m={};D.loans.forEach(l=>{m[l.bank]=m[l.bank]||{emi:0,out:0};m[l.bank].emi+=l.emi;m[l.bank].out+=Math.max(0,l.amount-loanPaid(l.id))});return Object.entries(m).map(([b,v])=>`<div class="item"><b>${esc(b)}</b><div class="right"><b>${money(v.emi)}</b><div class="small">Outstanding ${money(v.out)}</div></div></div>`).join('')||'<div class="empty">No loans.</div>'}
function openModal(t){$('modal').style.display='flex';$('mh').textContent=t==='customer'?'Add Customer':t==='loan'?'Add Bank / Loan / EMI':'Add Transaction';let cs=D.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''),ls=D.loans.map(l=>`<option value="${l.id}">${esc(l.bank)} — ${esc(l.name)}</option>`).join(''),f='';
if(t==='customer')f=`<label>Name</label><input id="name" required><label>Phone</label><input id="phone"><label>Opening Udhar</label><input id="opening" type="number" min="0" value="0">`;
if(t==='loan')f=`<label>Bank / Finance Company</label><input id="bank" required placeholder="HDFC / SBI / Chola Mandalam"><label>Loan Name</label><input id="lname" required placeholder="Personal / Equipment Loan"><div class="row"><div><label>Loan Amount</label><input id="lamt" type="number" min="0" required></div><div><label>Monthly EMI</label><input id="emi" type="number" min="1" required></div></div><div class="row"><div><label>Due Day</label><input id="due" type="number" min="1" max="31" required></div><div><label>Total EMIs</label><input id="total" type="number" min="1" required></div></div><label>First EMI Date</label><input id="first" type="date" value="${today()}" required>`;
if(t==='tx')f=`<label>Type</label><select id="kind" onchange="changeTx()"><option value="in">Money Received</option><option value="out">Money Paid</option><option value="given">Udhar Given</option><option value="recovered">Udhar Recovered</option><option value="emi">EMI Paid</option></select><div id="personBox"><label>Customer</label><select id="customer"><option value="">— Select —</option>${cs}</select></div><div id="loanBox" style="display:none"><label>Loan</label><select id="loan"><option value="">— Select —</option>${ls}</select></div><label>Description</label><input id="desc" required><div class="row"><div><label>Amount</label><input id="amt" type="number" min="0" required></div><div><label>Date</label><input id="date" type="date" value="${today()}" required></div></div><label>Method</label><select id="method"><option>Cash</option><option>Bank</option><option>UPI</option></select>`;
$('fields').innerHTML=f;$('modal').dataset.type=t}
function changeTx(){let k=$('kind').value;$('personBox').style.display=k==='emi'?'none':'block';$('loanBox').style.display=k==='emi'?'block':'none'}
function closeModal(){$('modal').style.display='none'}
function saveForm(e){e.preventDefault();let t=$('modal').dataset.type;if(t==='customer')D.customers.push({id:Date.now(),name:$('name').value,phone:$('phone').value,opening:+$('opening').value||0});if(t==='loan')D.loans.push({id:Date.now(),bank:$('bank').value,name:$('lname').value,amount:+$('lamt').value,emi:+$('emi').value,due:+$('due').value,total:+$('total').value,first:$('first').value});if(t==='tx')D.tx.unshift({id:Date.now(),kind:$('kind').value,customer:$('customer')?.value||'',loan:$('loan')?.value||'',desc:$('desc').value,amount:+$('amt').value,date:$('date').value,method:$('method').value});save();closeModal();render('dash')}
function quickEMI(id){let l=D.loans.find(x=>x.id===id),n=Math.floor(loanPaid(id)/l.emi)+1;if(n>l.total)return;D.tx.unshift({id:Date.now(),kind:'emi',loan:id,customer:'',desc:l.bank+' — '+l.name+' EMI #'+n,amount:l.emi,date:today(),method:'Bank'});save();render('loans')}
function notifyDue(){let due=D.loans.filter(l=>Math.floor(loanPaid(l.id)/l.emi)<l.total).map(l=>l.bank+' — '+l.name+': '+money(l.emi)+' due '+l.due+'th');alert(due.length?'Upcoming EMI\\n\\n'+due.join('\\n'):'No active EMIs');requestNotify(false)}
async function requestNotify(show=true){if(!('Notification'in window)){if(show)alert('Notifications are not supported in this browser.');return}let p=await Notification.requestPermission();if(show)alert(p==='granted'?'Notifications enabled.':'Notification permission not granted.')}
function setBiz(){D.settings.business=$('biz').value.trim()||'Money Manager';save();render('settings')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='money-manager-backup-'+today()+'.json';a.click()}
function restoreFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.customers&&x.loans&&x.tx){D=x;save();render('dash');alert('Backup restored successfully.')}else alert('Invalid backup')}catch(_){alert('Invalid backup')}};r.readAsText(f)}
function exportCSV(){let rows=[['Date','Type','Description','Customer','Loan','Amount','Method'],...D.tx.map(x=>[x.date,x.kind,x.desc,cname(x.customer),(D.loans.find(l=>l.id==x.loan)||{}).name||'',x.amount,x.method])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='transactions-'+today()+'.csv';a.click()}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
