<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<title>Money Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17181b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111318;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:23px}.sub{font-size:12px;opacity:.7;margin-top:3px}
.wrap{max-width:920px;margin:auto;padding:14px 14px 100px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.tabs button{border:0;border-radius:10px;padding:10px 13px;white-space:nowrap;background:#e7e9ee}.tabs .on{background:#111318;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#fff;border:1px solid #e5e6e9;border-radius:16px;padding:14px}.label{font-size:11px;color:#737780}.num{font-size:20px;font-weight:800;margin-top:4px}.green{color:#16803b}.red{color:#c0392b}.blue{color:#2867d8}.orange{color:#b76b00}
.section{margin-top:17px}.title{font-size:17px;font-weight:800;margin-bottom:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.btn{border:0;border-radius:11px;padding:12px;background:#111318;color:#fff;font-weight:750}.btn.alt{background:#e7e9ee;color:#111318}.btn.warn{background:#fff0df;color:#9a5900}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.small{font-size:11px;color:#737780;margin-top:3px}.right{text-align:right}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;background:#edf2ff;color:#2867d8}.pill.red{background:#fff0f0;color:#c0392b}.pill.green{background:#edf8ef;color:#16803b}.pill.orange{background:#fff4e4;color:#b76b00}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:15px;margin-bottom:9px}.empty{text-align:center;color:#777;padding:20px;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px;max-height:94vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{font-size:11px;color:#666}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0 11px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:7}nav button{border:0;background:none;font-size:11px;color:#666}.active{color:#2867d8!important;font-weight:800}
.kpi{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.kpi:last-child{border:0}
#auth{min-height:100vh;background:#111318;color:#fff;padding:42px 20px;display:flex;align-items:center;justify-content:center}
.authbox{width:100%;max-width:430px;background:#fff;color:#17181b;border-radius:20px;padding:24px}.authbox h2{margin:0 0 6px}.authbox p{color:#666;font-size:13px}.authbox input{margin-bottom:10px}.authbox .btn{width:100%;margin-top:5px}.authmsg{font-size:12px;margin-top:12px;min-height:18px}.userbar{font-size:11px;opacity:.75;margin-top:6px}
@media(min-width:680px){.grid{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(4,1fr)}}

.row-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;margin-top:7px}
.mini{border:0;border-radius:8px;padding:6px 9px;background:#e7e9ee;color:#111318;font-weight:750;font-size:11px}
.mini.danger{background:#ffe7e5;color:#b42318}
.item-main{min-width:0;flex:1}
.bank-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
hr{border:0;border-top:1px solid #eee;margin:14px 0}
</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<div id="auth">
  <div class="authbox">
    <h2>Money Manager</h2>
    <p>Secure cloud account for customers, loans, EMIs, udhar and transactions.</p>
    <label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com">
    <label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Minimum 8 characters">
    <button type="button" class="btn" onclick="signIn()">Login</button>
    <button type="button" class="btn alt" style="width:100%;margin-top:8px" onclick="signUp()">Create account</button>
    <div id="authMsg" class="authmsg">Connecting securely…</div>
  </div>
</div>
<div id="pinLock" style="display:none;position:fixed;inset:0;background:#f5f6f8;z-index:9999;align-items:center;justify-content:center;padding:20px">
  <div class="card" style="width:100%;max-width:360px;text-align:center">
    <div style="font-size:42px;margin-bottom:10px">🔒</div>
    <h2 style="margin:0 0 8px">Money Manager Locked</h2>
    <div class="small" style="margin-bottom:18px">Enter your PIN to continue</div>

    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter PIN"
      style="width:100%;text-align:center;font-size:24px;letter-spacing:8px"
      onkeydown="if(event.key==='Enter')unlockApp()"
    >

    <button class="btn" style="width:100%;margin-top:12px" onclick="unlockApp()">
      Unlock
    </button>

    <div id="pinError" class="small" style="color:#b91c1c;margin-top:10px"></div>
  </div>
</div>
<div id="appShell" style="display:none">
<header>
  <h1 id="appTitle">Money Manager</h1>
  <div class="sub">Loans • EMIs • Customers • Udhar • Cash Flow</div>
  <div class="userbar" id="userBar"></div>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="on" onclick="go('dash',this)">Dashboard</button>
    <button onclick="go('customers',this)">Customers</button>
    <button onclick="go('loans',this)">Banks & Loans</button>
    <button onclick="go('tx',this)">Transactions</button>
    <button onclick="go('reminders',this)">Reminders</button>
    <button onclick="go('reports',this)">Reports</button>
    <button onclick="go('settings',this)">Settings</button>
  </div>
  <div id="app"></div>
</div>
<nav>
  <button class="active" onclick="go('dash')">⌂<br>Home</button>
  <button onclick="openModal('customer')">👤<br>Customer</button>
  <button onclick="openModal('loan')">💳<br>Loan/EMI</button>
  <button onclick="openModal('tx')">＋<br>Transaction</button>
  <button onclick="backup()">💾<br>Backup</button>
</nav>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <button class="close" onclick="closeModal()">×</button>
    <h2 id="mh">Add</h2>
    <form id="form" onsubmit="saveForm(event)"><div id="fields"></div><button class="btn" style="width:100%">Save</button></form>
  </div>
</div>

<input id="restore" type="file" accept=".json" style="display:none" onchange="restoreFile(event)">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://yqlcxztvdyehorhykgwc.supabase.co";
const SUPABASE_KEY="sb_publishable_W5rirgN1NiEu5Syyn0fH_Q_U_WLx9UA";
let sb=null;
let USER=null;

function setAuthMsg(t, ok=false){
  const el=document.getElementById("authMsg");
  if(el){el.textContent=t;el.style.color=ok?"#16803c":"#b42318";}
}

function initSupabase(){
  try{
    if(!window.supabase || typeof window.supabase.createClient!=="function"){
      setAuthMsg("Secure connection library did not load. Please refresh the page.");
      return false;
    }
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    setAuthMsg("Ready — enter your email and password.", true);
    return true;
  }catch(err){
    console.error(err);
    setAuthMsg("Could not start secure connection. Please refresh the page.");
    return false;
  }
}
let D={customers:[],banks:[],loans:[],emis:[],tx:[],reminders:[],settings:{business:"Money Manager"}};

const $=id=>document.getElementById(id);
const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

async function signUp(){
  try{
    if(!sb) return setAuthMsg("Secure connection is not ready. Please refresh the page.");
    const email=$('authEmail').value.trim();
    const password=$('authPassword').value;
    if(!email) return setAuthMsg("Please enter your email address.");
    if(!email.includes("@") || !email.includes(".")) return setAuthMsg("Please enter a valid email address.");
    if(password.length<8) return setAuthMsg("Password must be at least 8 characters.");
    setAuthMsg("Creating your account…", true);
    const {data,error}=await sb.auth.signUp({
      email,
      password,
      options:{emailRedirectTo:location.href}
    });
    if(error){
      console.error(error);
      return setAuthMsg(error.message || "Account creation failed.");
    }
    if(data && data.user && !data.session){
      return setAuthMsg("Account created. Please check your email and confirm it, then come back and Login.", true);
    }
    setAuthMsg("Account created successfully. Opening Money Manager…", true);
  }catch(err){
    console.error(err);
    setAuthMsg("Signup error: "+(err?.message || "Please refresh and try again."));
  }
}

async function signIn(){
  try{
    if(!sb) return setAuthMsg("Secure connection is not ready. Please refresh the page.");
    const email=$('authEmail').value.trim();
    const password=$('authPassword').value;
    if(!email||!password)return setAuthMsg("Enter email and password.");
    setAuthMsg("Logging in…", true);
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){
      console.error(error);
      return setAuthMsg(error.message || "Login failed.");
    }
  }catch(err){
    console.error(err);
    setAuthMsg("Login error: "+(err?.message || "Please refresh and try again."));
  }
}

async function signOut(){
  try{if(sb)await sb.auth.signOut();}catch(e){console.error(e)}
  location.reload();
}

async function init(){
  if(!initSupabase())return;
  try{
    const {data:{session},error}=await sb.auth.getSession();
    if(error){
      console.error(error);
      return setAuthMsg(error.message || "Could not check login session.");
    }
    if(session){USER=session.user;await startApp();}
    sb.auth.onAuthStateChange(async(_e,session)=>{
      try{
        if(session&&!USER){USER=session.user;await startApp();}
        if(!session&&USER){USER=null;location.reload();}
      }catch(err){console.error(err);setAuthMsg("Could not open your account data.");}
    });
  }catch(err){
    console.error(err);
    setAuthMsg("Secure connection error. Please refresh the page.");
  }
}

async function startApp(){
  $('auth').style.display='none';
  $('appShell').style.display='none';
  $('userBar').textContent='Signed in: '+USER.email;

  await loadCloud();

  if(localStorage.getItem('mm_pin_hash')){
    $('pinLock').style.display='flex';
    $('pinInput').value='';
    $('pinError').textContent='';
    setTimeout(()=>$('pinInput').focus(),100);
    return;
  }

  $('appShell').style.display='block';
  render('dash');
}

async function loadCloud(){
  const uid=USER.id;
  const [c,b,l,e,t,r]=await Promise.all([
    sb.from('customers').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    sb.from('banks').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    sb.from('loans').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    sb.from('emis').select('*').eq('user_id',uid).order('due_date',{ascending:true}),
    sb.from('transactions').select('*').eq('user_id',uid).order('transaction_date',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('reminders').select('*').eq('user_id',uid).order('reminder_date',{ascending:true})
  ]);
  if(c.error||b.error||l.error||e.error||t.error||r.error){
    alert('Cloud data load error. Please check Supabase tables/policies.');
    console.error(c.error,b.error,l.error,e.error,t.error,r.error);return;
  }
  D.customers=c.data||[];D.banks=b.data||[];D.loans=l.data||[];D.emis=e.data||[];D.tx=t.data||[];D.reminders=r.data||[];
  D.settings=JSON.parse(localStorage.getItem('mm_settings')||'{"business":"Money Manager"}');
  $('appTitle').textContent=D.settings.business||'Money Manager';
}

async function insert(table,row){const {data,error}=await sb.from(table).insert({...row,user_id:USER.id}).select().single();if(error)throw error;return data}
async function update(table,id,patch){const {error}=await sb.from(table).update(patch).eq('id',id).eq('user_id',USER.id);if(error)throw error}

function go(p,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');render(p)}

function render(p='dash'){
  const rec=D.tx.filter(x=>['money_received','udhar_recovered'].includes(x.transaction_type)).reduce((a,x)=>a+Number(x.amount||0),0);
  const paid=D.tx.filter(x=>['money_paid','emi_paid'].includes(x.transaction_type)).reduce((a,x)=>a+Number(x.amount||0),0);
  const given=D.tx.filter(x=>x.transaction_type==='udhar_given').reduce((a,x)=>a+Number(x.amount||0),0);
  const recovered=D.tx.filter(x=>x.transaction_type==='udhar_recovered').reduce((a,x)=>a+Number(x.amount||0),0);

  if(p==='dash'){
  const loanOutstanding=D.loans.reduce(
    (a,l)=>a+Math.max(0,Number(l.principal_amount||0)-loanPaid(l.id)),0
  );

  const pendingEmis=D.emis.filter(e=>e.status!=='paid').length;

  $('app').innerHTML=
    `<div class="grid">
      <div class="card">
        <div class="label">Money Received</div>
        <div class="num green">${money(rec)}</div>
      </div>

      <div class="card">
        <div class="label">Money Paid</div>
        <div class="num red">${money(paid)}</div>
      </div>

      <div class="card">
        <div class="label">Pending Udhar</div>
        <div class="num orange">${money(Math.max(0,given-recovered))}</div>
      </div>

      <div class="card">
        <div class="label">Loan Outstanding</div>
        <div class="num blue">${money(loanOutstanding)}</div>
      </div>

      <div class="card">
        <div class="label">Monthly EMI</div>
        <div class="num blue">${money(D.loans.reduce((a,l)=>a+Number(l.emi_amount||0),0))}</div>
      </div>

      <div class="card">
        <div class="label">Pending EMIs</div>
        <div class="num">${pendingEmis}</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" onclick="openModal('customer')">+ Customer</button>
      <button class="btn" onclick="openModal('loan')">+ Bank / Loan</button>
      <button class="btn alt" onclick="openModal('tx')">+ Transaction</button>
      <button class="btn warn" onclick="notifyDue()">🔔 Check Reminders</button>
    </div>

    <div class="section">
      <div class="title">
       <div class="title">
  EMI Schedule
  <button class="btn alt" style="float:right;padding:6px 10px;font-size:11px" onclick="go('loans')">View All EMIs →</button>
        <span class="small" style="margin-left:10px">
          🔴 ${D.emis.filter(e=>e.status!=='paid'&&e.due_date<today()).length} Overdue
          &nbsp; 🟠 ${D.emis.filter(e=>e.status!=='paid'&&e.due_date===today()).length} Due Today
          &nbsp; 🔵 ${D.emis.filter(e=>e.status!=='paid'&&e.due_date>today()).length} Upcoming
          &nbsp; 🟢 ${D.emis.filter(e=>e.status==='paid').length} Paid
        </span>
      </div>
      <div class="card">${emiRows()}</div>
    </div>

    <div class="section">
      <div class="title">Recent Activity</div>
      <div class="card">${txRows(8)}</div>
    </div>`;
}

  if(p==='customers')$('app').innerHTML=
    `<div class="actions"><button class="btn" onclick="openModal('customer')">+ Customer</button></div>
     <input class="search" placeholder="Search customer..." oninput="filterCustomers(this.value)">
     <div id="customerList" class="card">${customerRows(D.customers)}</div>`;

  if(p==='loans')$('app').innerHTML=
    `<div class="actions"><button class="btn" onclick="openModal('loan')">+ Bank / Loan / EMI</button><button class="btn alt" onclick="openModal('bank')">+ Bank / Finance Company</button></div>
     <div class="section"><div class="title">Banks / Finance Companies</div>
       <div class="card">${bankRows()}</div>
     </div>
     <div class="section"><div class="title">Loans</div>
       <div class="card">${D.loans.length?D.loans.map(loanRow).join(''):'<div class="empty">No loans added.</div>'}</div>
     </div>
     <div class="section">
  <div class="title">EMI Records</div>
  <div class="actions" style="margin:8px 0">
    <button class="btn alt" onclick="document.getElementById('emiRecordsList').innerHTML=emiAllRows('all')">All</button>
    <button class="btn alt" onclick="document.getElementById('emiRecordsList').innerHTML=emiAllRows('all')">Pending</button>
    <button class="btn alt" onclick="document.getElementById('emiRecordsList').innerHTML=emiAllRows('overdue')">Overdue</button>
    <button class="btn alt" onclick="document.getElementById('emiRecordsList').innerHTML=emiAllRows('today')">Due Today</button>
    <button class="btn alt" onclick="document.getElementById('emiRecordsList').innerHTML=emiAllRows('upcoming')">Upcoming</button>
    <button class="btn alt" onclick="document.getElementById('emiRecordsList').innerHTML=emiAllRows('paid')">Paid</button>
  </div>
  <div id="emiRecordsList" class="card">${emiAllRows()}</div>
</div>`;
 if(p==='tx')$('app').innerHTML=
  `<div class="actions"><button class="btn" onclick="openModal('tx')">+ Transaction</button></div>
  <div class="card">
    <input id="txSearch" class="search" placeholder="Search description, customer, loan or amount..." oninput="filterTransactions()">
    <div class="actions" style="margin-top:8px">
      <select id="txType" onchange="filterTransactions()">
        <option value="all">All Types</option>
        <option value="money_received">Money Received</option>
        <option value="money_paid">Money Paid</option>
        <option value="udhar_given">Udhar Given</option>
        <option value="udhar_recovered">Udhar Recovered</option>
        <option value="emi_paid">EMI Paid</option>
      </select>
      <select id="txMethod" onchange="filterTransactions()">
        <option value="all">All Methods</option>
        <option value="cash">Cash</option>
        <option value="bank">Bank</option>
        <option value="upi">UPI</option>
      </select>
    </div>
    <div id="transactionList">${txRows(200)}</div>
  </div>`;

  if(p==='reminders')$('app').innerHTML=
    `<div class="actions"><button class="btn" onclick="openModal('reminder')">+ Reminder</button></div>
     <div class="card">${reminderRows()}</div>`;

  if(p==='reports')$('app').innerHTML=reports(rec,paid,given,recovered);

  if(p==='settings')$('app').innerHTML=
  `<div class="card">
    <div class="title">Settings</div>

    <label>Business / Account Name</label>
    <input id="biz" value="${esc(D.settings.business)}">
    <button class="btn" onclick="setBiz()">Save Name</button>

    <hr>

    <div class="title">Privacy Lock</div>
    <div class="small" style="margin-bottom:10px">
      Protect Money Manager with a 4–6 digit PIN.
    </div>

    <button class="btn" onclick="setPin()">🔐 Set / Change PIN</button>
    <button class="btn alt" onclick="lockApp()">🔒 Lock Now</button>

    <hr>

    <button class="btn alt" onclick="requestNotify()">Enable Notifications</button><br><br>
    <button class="btn alt" onclick="backup()">Export Backup</button><br><br>
    <button class="btn alt" onclick="document.getElementById('restore').click()">Restore Local Backup</button><br><br>
    <button class="btn" onclick="signOut()">Logout</button>

    <p class="small">Cloud sync is active. Local settings/backups are also available.</p>
  </div>`;
}
function actionButtons(type,id,label){
  return `<div class="row-actions">
    <button type="button" class="mini" onclick="editRecord('${type}','${id}')">✏️ Edit</button>
    <button type="button" class="mini danger" onclick='deleteRecord("${type}","${id}",decodeURIComponent("${encodeURIComponent(label)}"))'>🗑️ Delete</button>
  </div>`;
}

function bankRows(){
  if(!D.banks.length)return '<div class="empty">No banks / finance companies added.</div>';
  return D.banks.map(b=>{
    const count=D.loans.filter(l=>l.bank_id===b.id).length;
    return `<div class="item"><div class="item-main"><b>${esc(b.name)}</b><div class="small">${count} linked loan${count===1?'':'s'}</div></div><div class="right">${actionButtons('bank',b.id,b.name)}</div></div>`;
  }).join('');
}

function customerRows(a){
  if(!a.length)return '<div class="empty">No customers.</div>';
  return a.map(c=>{
    const g=D.tx.filter(x=>x.customer_id===c.id&&x.transaction_type==='udhar_given').reduce((a,x)=>a+Number(x.amount||0),0);
    const r=D.tx.filter(x=>x.customer_id===c.id&&x.transaction_type==='udhar_recovered').reduce((a,x)=>a+Number(x.amount||0),0);
    return `<div class="item"><div class="item-main"><b>${esc(c.name)}</b><div class="small">${esc(c.phone||'No phone')} • ${D.tx.filter(x=>x.customer_id===c.id).length} entries</div></div><div class="right"><b>${money(Math.max(0,g-r))}</b><div class="small">pending</div>${actionButtons('customer',c.id,c.name)}</div></div>`;
  }).join('');
}
function filterCustomers(q){q=q.toLowerCase();$('customerList').innerHTML=customerRows(D.customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q)))}
function loanPaid(id){return D.emis.filter(e=>e.loan_id===id&&e.status==='paid').reduce((a,e)=>a+Number(e.paid_amount||e.amount||0),0)}
function loanRow(l){
  const paidEmis=D.emis.filter(e=>e.loan_id===l.id&&e.status==='paid').length;
  const left=Math.max(0,Number(l.total_emis||0)-paidEmis);
  const out=Math.max(0,Number(l.principal_amount||0)-loanPaid(l.id));
  const bank=(D.banks.find(b=>b.id===l.bank_id)||{}).name||'Bank';

function emiRows(){
  const todayDate=today();

  const rows=D.emis
    .filter(e=>e.status!=='paid')
    .sort((a,b)=>{
      const aOver=a.due_date<todayDate;
      const bOver=b.due_date<todayDate;

      const aRank=aOver?0:(a.due_date===todayDate?1:2);
      const bRank=bOver?0:(b.due_date===todayDate?1:2);

      return aRank-bRank || String(a.due_date).localeCompare(String(b.due_date));
    })
    .slice(0,10);

  if(!rows.length)return '<div class="empty">No pending EMIs.</div>';

  return rows.map(e=>{
    const l=D.loans.find(x=>x.id===e.loan_id);

    let status='Upcoming';
    if(e.due_date<todayDate)status='Overdue';
    else if(e.due_date===todayDate)status='Due Today';

    const statusStyle=
      status==='Overdue'
        ? 'background:#fee2e2;color:#991b1b'
        : status==='Due Today'
          ? 'background:#ffedd5;color:#9a3412'
          : 'background:#dbeafe;color:#1d4ed8';

    return `<div class="item">
      <div class="item-main">
        <b>${esc(l?.loan_name||'Loan')} — EMI #${e.emi_number}</b>
        <div class="small">Due ${e.due_date}</div>
        <div style="margin-top:5px">
          <span class="pill" style="${statusStyle}">${status}</span>
        </div>
        ${actionButtons('emi',e.id,'EMI #'+e.emi_number)}
      </div>
      <div class="right">
        <b>${money(e.amount)}</b><br>
        <button class="btn" style="padding:6px 8px;margin-top:5px" onclick="payEmi('${e.id}')">Mark Paid</button>
      </div>
    </div>`;
  }).join('');
}
function emiAllRows(filter='all'){
  if(!D.emis.length)return '<div class="empty">No EMI records.</div>';

  const todayDate=today();

  const filtered=D.emis.filter(e=>{
    if(filter==='paid')return e.status==='paid';
    if(e.status==='paid')return false;
    if(filter==='overdue')return e.due_date<todayDate;
    if(filter==='today')return e.due_date===todayDate;
    if(filter==='upcoming')return e.due_date>todayDate;
    return true;
  }).sort((a,b)=>{
    if(filter==='paid'){
      return String(b.paid_date||'').localeCompare(String(a.paid_date||''));
    }
    return String(a.due_date).localeCompare(String(b.due_date));
  });

  if(!filtered.length)return '<div class="empty">No EMIs in this category.</div>';

  return filtered.map(e=>{
    const l=D.loans.find(x=>x.id===e.loan_id);

    let status='Upcoming';
    if(e.status==='paid')status='Paid';
    else if(e.due_date<todayDate)status='Overdue';
    else if(e.due_date===todayDate)status='Due Today';

    return `<div class="item">
      <div class="item-main">
        <b>${esc(l?.loan_name||'Loan')} — EMI #${e.emi_number}</b>
        <div class="small">Due ${e.due_date} • ${money(e.amount)} • ${status}</div>
        ${e.status==='paid'?`<div class="small">Paid ${money(e.paid_amount||e.amount)} on ${e.paid_date||'—'}</div>`:''}
        ${actionButtons('emi',e.id,'EMI #'+e.emi_number)}
      </div>
      <div class="right">
        <span class="pill ${e.status==='paid'?'green':'blue'}">${status}</span>

      </div>
    </div>`;
  }).join('');
}

async function saveForm(e){
  e.preventDefault();
  const t=$('modal').dataset.type;
  const editId=$('modal').dataset.editId||null;
  try{
    if(t==='bank'){
      const patch={name:$('bank_name').value.trim()};
      if(!patch.name)throw new Error('Bank / finance company name is required.');
      if(editId){
        await update('banks',editId,patch);
        const b=D.banks.find(x=>x.id===editId); if(b)Object.assign(b,patch);
      }else{
        const b=await insert('banks',patch);D.banks.unshift(b);
      }
    }

    if(t==='reminder'){
      const patch={title:$('rem_title').value.trim(),reminder_date:$('rem_date').value,notes:$('rem_notes').value.trim()};
      if(!patch.title||!patch.reminder_date)throw new Error('Reminder title and date are required.');
      if(editId){
        await update('reminders',editId,patch);
        const r=D.reminders.find(x=>x.id===editId);if(r)Object.assign(r,patch);
      }else{
        const r=await insert('reminders',patch);D.reminders.push(r);
      }
    }

    if(t==='customer'){
      const patch={account_type:$('account_type').value,name:$('name').value.trim(),phone:$('phone').value.trim()};
      if(!patch.name)throw new Error('Customer name is required.');
      if(editId){
        await update('customers',editId,patch);
        const c=D.customers.find(x=>x.id===editId);Object.assign(c,patch);
      }else{
        const c=await insert('customers',patch);D.customers.unshift(c);
        const opening=Number($('opening').value)||0;
        if(opening)D.tx.unshift(await insert('transactions',{account_type:patch.account_type,customer_id:c.id,transaction_type:'udhar_given',amount:opening,payment_method:'cash',description:'Opening Udhar',transaction_date:today()}));
      }
    }

    if(t==='loan'){
      const patch={bank_id:$('bank_id').value,account_type:$('account_type').value,loan_name:$('lname').value.trim(),loan_number:$('loan_number').value.trim(),principal_amount:Number($('lamt').value)||0,outstanding_amount:Number($('lamt').value)||0,emi_amount:Number($('emi').value)||0,total_emis:Number($('total').value)||0,start_date:$('first').value,interest_rate:Number($('interest').value)||null};
      if(!patch.loan_name)throw new Error('Loan name is required.');
      let bankId=patch.bank_id;
      if(!bankId){
        const newName=$('newbank').value.trim();
        if(!newName)throw new Error('Select a bank or enter a new bank name.');
        const bank=await insert('banks',{name:newName});D.banks.unshift(bank);bankId=bank.id;patch.bank_id=bankId;
      }
      if(editId){
        await update('loans',editId,patch);
        const l=D.loans.find(x=>x.id===editId);Object.assign(l,patch);
        // Update only unpaid EMI amounts/dates to keep paid history intact.
        const pending=D.emis.filter(x=>x.loan_id===editId&&x.status!=='paid').sort((a,b)=>a.emi_number-b.emi_number);
        let d=new Date(patch.start_date+'T00:00:00');
        for(let i=1;i<=patch.total_emis;i++){
          const existing=D.emis.find(x=>x.loan_id===editId&&x.emi_number===i);
          if(existing && existing.status==='paid'){ d.setMonth(d.getMonth()+1); continue; }
          if(existing){
            const due=d.toISOString().slice(0,10);
            await update('emis',existing.id,{due_date:due,amount:patch.emi_amount});
            existing.due_date=due;existing.amount=patch.emi_amount;
          }else{
            const em=await insert('emis',{loan_id:editId,emi_number:i,due_date:d.toISOString().slice(0,10),amount:patch.emi_amount,status:'pending'});
            D.emis.push(em);
          }
          d.setMonth(d.getMonth()+1);
        }
      }else{
        const l=await insert('loans',patch);D.loans.unshift(l);
        let d=new Date(patch.start_date+'T00:00:00');
        for(let i=1;i<=l.total_emis;i++){
          const em=await insert('emis',{loan_id:l.id,emi_number:i,due_date:d.toISOString().slice(0,10),amount:l.emi_amount,status:'pending'});
          D.emis.push(em);d.setMonth(d.getMonth()+1);
        }
      }
    }

    if(t==='tx'){
      const patch={account_type:'personal',customer_id:$('customer_id')?.value||null,loan_id:$('loan_id')?.value||null,transaction_type:$('kind').value,amount:Number($('amt').value)||0,payment_method:$('method').value,description:$('desc').value.trim(),transaction_date:$('date').value};
      if(!patch.description)throw new Error('Description is required.');
      if(editId){
        await update('transactions',editId,patch);
        const x=D.tx.find(z=>z.id===editId);Object.assign(x,patch);
      }else{
        const tx=await insert('transactions',patch);D.tx.unshift(tx);
        if(tx.transaction_type==='emi_paid'&&tx.loan_id){
          const pending=D.emis.find(x=>x.loan_id===tx.loan_id&&x.status!=='paid');
          if(pending)await payEmi(pending.id,tx.amount,tx.transaction_date,tx.payment_method,false);
        }
      }
    }

    if(t==='emi'){
      const patch={due_date:$('emi_due').value,amount:Number($('emi_amount').value)||0,status:$('emi_status').value};
      if(editId){
        const old=D.emis.find(x=>x.id===editId);
        if(patch.status==='paid' && old.status!=='paid'){
          await update('emis',editId,{...patch,paid_amount:patch.amount,paid_date:today(),payment_method:'bank'});
          Object.assign(old,{...patch,paid_amount:patch.amount,paid_date:today(),payment_method:'bank'});
        }else{
          await update('emis',editId,patch);
          Object.assign(old,patch);
        }
      }
    }

    closeModal();render('dash');
  }catch(err){alert('Save failed: '+(err.message||err));}
}

function editRecord(type,id){

  openModal(type,id);
}
async function deleteRecord(type,id,label){
  if(!confirm('Delete '+(label||'this record')+'? This cannot be undone.'))return;
  try{
    if(type==='customer'){
      const linked=D.tx.filter(x=>x.customer_id===id);
      if(linked.length)throw new Error('This customer has transaction history. Delete those transactions first, then delete the customer.');
      const {error}=await sb.from('customers').delete().eq('id',id).eq('user_id',USER.id);
      if(error)throw error;
      D.customers=D.customers.filter(x=>x.id!==id);
    }
    if(type==='bank'){
      const linked=D.loans.filter(x=>x.bank_id===id);
      if(linked.length)throw new Error('This bank has linked loans. Delete or move the loans first.');
      const {error}=await sb.from('banks').delete().eq('id',id).eq('user_id',USER.id);
      if(error)throw error;
      D.banks=D.banks.filter(x=>x.id!==id);
    }
    if(type==='loan'){
      await sb.from('transactions').delete().eq('loan_id',id).eq('user_id',USER.id);
      await sb.from('emis').delete().eq('loan_id',id).eq('user_id',USER.id);
      const {error}=await sb.from('loans').delete().eq('id',id).eq('user_id',USER.id);
      if(error)throw error;
      D.tx=D.tx.filter(x=>x.loan_id!==id);D.emis=D.emis.filter(x=>x.loan_id!==id);D.loans=D.loans.filter(x=>x.id!==id);
    }
    if(type==='emi'){
      const {error}=await sb.from('emis').delete().eq('id',id).eq('user_id',USER.id);
      if(error)throw error;
      D.emis=D.emis.filter(x=>x.id!==id);
    }
    if(type==='reminder'){
      const {error}=await sb.from('reminders').delete().eq('id',id).eq('user_id',USER.id);
      if(error)throw error;
      D.reminders=D.reminders.filter(x=>x.id!==id);
    }
    if(type==='transaction'){
      const {error}=await sb.from('transactions').delete().eq('id',id).eq('user_id',USER.id);
      if(error)throw error;
      D.tx=D.tx.filter(x=>x.id!==id);
    }
    render('dash');
  }catch(err){alert('Delete failed: '+(err.message||err));}
}

async function quickEMI(loanId){
  const e=D.emis.find(x=>x.loan_id===loanId&&x.status!=='paid');if(e)await payEmi(e.id);
}
async function payEmi(emiId,amount,date,method,syncTx=true){
  const e=D.emis.find(x=>x.id===emiId);
  if(!e||e.status==='paid')return;

  const amt=Number(amount||e.amount);
  const today=new Date().toISOString().slice(0,10);

  const paymentDate=prompt(
    'Payment Date (YYYY-MM-DD):',
    date||today
  );

  if(paymentDate===null)return;

  if(!/^\d{4}-\d{2}-\d{2}$/.test(paymentDate)){
    alert('Please enter a valid payment date in YYYY-MM-DD format.');
    return;
  }

  const pm=method||'bank';

  if(!confirm(
    'Confirm EMI Payment\n\n' +
'Amount: ₹'+amt.toLocaleString('en-IN')+'\n' +
'Payment Date: '+paymentDate
  ))return;

  try{
    await update('emis',e.id,{
      status:'paid',
      paid_amount:amt,
      paid_date:paymentDate,
      payment_method:pm
    });

    e.status='paid';
    e.paid_amount=amt;
    e.paid_date=paymentDate;
    e.payment_method=pm;

    if(syncTx){
      const tx=await insert('transactions',{
        account_type:'personal',
        loan_id:e.loan_id,
        transaction_type:'emi_paid',
        amount:amt,
        payment_method:pm,
        description:'EMI #'+e.emi_number+' paid',
        transaction_date:paymentDate
      });
      D.tx.unshift(tx);
    }

    render('dash');
  }catch(err){
    alert('EMI update failed: '+(err.message||err));
  }
}

function backup(){
  try{
    const payload={
      app:'Money Manager',
      backup_version:2,
      exported_at:new Date().toISOString(),
      data:{
        customers:D.customers,
        banks:D.banks,
        loans:D.loans,
        emis:D.emis,
        tx:D.tx,
        reminders:D.reminders,
        settings:D.settings
      }
    };

    const json=JSON.stringify(payload,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');

    a.href=url;
    a.download='money-manager-backup-'+today()+'.json';
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(()=>URL.revokeObjectURL(url),1000);

    alert('Backup downloaded successfully.');
  }catch(err){
    alert('Backup failed: '+(err.message||err));
  }
}
async function restoreFile(e){
  const file=e.target.files?.[0];
  e.target.value='';
  if(!file)return;

  try{
    const text=await file.text();
    const backupData=JSON.parse(text);

    const data=backupData.data||backupData;

    if(
      !data ||
      !Array.isArray(data.customers) ||
      !Array.isArray(data.banks) ||
      !Array.isArray(data.loans) ||
      !Array.isArray(data.emis) ||
      !Array.isArray(data.tx) ||
      !Array.isArray(data.reminders)
    ){
      throw new Error('This is not a valid Money Manager backup file.');
    }

    const total=
      data.customers.length+
      data.banks.length+
      data.loans.length+
      data.emis.length+
      data.tx.length+
      data.reminders.length;

    if(!confirm(
      'Restore this backup?\n\n'+
      'Records to restore: '+total+'\n\n'+
      'This will replace your current cloud data.\n'+
      'A safety backup will be downloaded first.\n\n'+
      'Continue?'
    ))return;

    backup();

    if(!confirm(
      'Final confirmation\n\n'+
      'Your current cloud data will now be replaced by this backup.\n\n'+
      'Continue with restore?'
    ))return;

    const tables=[
      'transactions',
      'emis',
      'loans',
      'banks',
      'customers',
      'reminders'
    ];

    for(const table of tables){
      const {error}=await sb.from(table).delete().eq('user_id',USER.id);
      if(error)throw error;
    }

    const cleanRows=rows=>
      rows.map(({user_id,...row})=>({...row,user_id:USER.id}));

    const restoreTable=async(table,rows)=>{
      if(!rows.length)return;
      const {error}=await sb.from(table).insert(cleanRows(rows));
      if(error)throw error;
    };

    await restoreTable('customers',data.customers);
    await restoreTable('banks',data.banks);
    await restoreTable('loans',data.loans);
    await restoreTable('emis',data.emis);
    await restoreTable('transactions',data.tx);
    await restoreTable('reminders',data.reminders);

    if(data.settings){
      D.settings=data.settings;
      localStorage.setItem('mm_settings',JSON.stringify(D.settings));
    }

    await init();

    alert('Backup restored successfully.');
  }catch(err){
    alert('Restore failed: '+(err.message||err));
  }
}

}async function pinHash(pin){
  const data=new TextEncoder().encode(pin);
  const hash=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(hash))
    .map(b=>b.toString(16).padStart(2,'0'))
    .join('');
}

async function setPin(){
  const current=localStorage.getItem('mm_pin_hash');

  if(current){
    const oldPin=prompt('Enter your current PIN:');
    if(oldPin===null)return;

    if(await pinHash(oldPin)!==current){
      alert('Incorrect current PIN.');
      return;
    }
  }

  const pin=prompt('Set a new 4–6 digit PIN:');
  if(pin===null)return;

  if(!/^\d{4,6}$/.test(pin)){
    alert('PIN must contain 4–6 digits only.');
    return;
  }

  const confirmPin=prompt('Confirm your new PIN:');
  if(confirmPin===null)return;

  if(pin!==confirmPin){
    alert('PINs do not match.');
    return;
  }

  localStorage.setItem('mm_pin_hash',await pinHash(pin));
  alert(current?'PIN changed successfully.':'PIN set successfully.');
}

async function unlockApp(){
  const stored=localStorage.getItem('mm_pin_hash');
  const input=$('pinInput');

  if(!stored){
    $('pinLock').style.display='none';
    $('appShell').style.display='block';
    return;
  }

  const pin=(input?.value||'').trim();

  if(!/^\d{4,6}$/.test(pin)){
    $('pinError').textContent='Enter your 4–6 digit PIN.';
    return;
  }

  if(await pinHash(pin)!==stored){
    $('pinError').textContent='Incorrect PIN.';
    input.value='';
    input.focus();
    return;
  }

  $('pinError').textContent='';
  input.value='';
  $('pinLock').style.display='none';
  $('appShell').style.display='block';
}

function lockApp(){
  if(!localStorage.getItem('mm_pin_hash')){
    alert('Please set a PIN first.');
    return;
  }

  $('appShell').style.display='none';
  $('pinLock').style.display='flex';
  $('pinInput').value='';
  $('pinError').textContent='';

  setTimeout(()=>$('pinInput').focus(),100);
}

      .reduce((a,x)=>a+Number(x.amount||0),0);

    const paid=D.tx
      .filter(x=>['money_paid','emi_paid'].includes(x.transaction_type))
      .reduce((a,x)=>a+Number(x.amount||0),0);

    const given=D.tx
      .filter(x=>x.transaction_type==='udhar_given')
      .reduce((a,x)=>a+Number(x.amount||0),0);

    const recovered=D.tx
      .filter(x=>x.transaction_type==='udhar_recovered')
      .reduce((a,x)=>a+Number(x.amount||0),0);

    const outstanding=D.loans.reduce(
      (a,l)=>a+Math.max(0,Number(l.principal_amount||0)-loanPaid(l.id)),
      0
    );

    const monthlyEmi=D.loans.reduce(
      (a,l)=>a+Number(l.emi_amount||0),
      0
    );

    let y=20;

    doc.setFontSize(18);
    doc.text('Money Manager Report',14,y);
    y+=10;

    doc.setFontSize(10);
    doc.text('Generated: '+new Date().toLocaleString(),14,y);
    y+=12;

    doc.setFontSize(13);
    doc.text('Overall Summary',14,y);
    y+=8;

    const summary=[
      ['Money Received',received],
      ['Money Paid',paid],
      ['Udhar Given',given],
      ['Udhar Recovered',recovered],
      ['Pending Udhar',Math.max(0,given-recovered)],
      ['Loan Outstanding',outstanding],
      ['Monthly EMI',monthlyEmi]
    ];

    doc.setFontSize(10);

    summary.forEach(row=>{
      doc.text(row[0],14,y);
      doc.text('Rs. '+Number(row[1]||0).toLocaleString('en-IN'),100,y);
      y+=6;
    });

    y+=6;
    doc.setFontSize(13);
    doc.text('Transactions',14,y);
    y+=8;

    doc.setFontSize(8);

    D.tx.forEach(x=>{
      const customer=x.customer_id?cname(x.customer_id):'';
      const loan=x.loan_id?((D.loans.find(l=>l.id===x.loan_id)||{}).loan_name||''):'';

      const line=
        (x.transaction_date||'')+' | '+
        (x.transaction_type||'')+' | '+
        (x.description||'')+' | '+
        (customer||'')+' | '+
        (loan||'')+' | Rs. '+
        Number(x.amount||0).toLocaleString('en-IN');

      const wrapped=doc.splitTextToSize(line,180);

      if(y+wrapped.length*4>285){
        doc.addPage();
        y=20;
      }

      doc.text(wrapped,14,y);
      y+=wrapped.length*4+2;
    });

    doc.save('money-manager-report-'+today()+'.pdf');

    alert('PDF report downloaded successfully.');
  }catch(err){
    alert('PDF export failed: '+(err.message||err));
  }
}
